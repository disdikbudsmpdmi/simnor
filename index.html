    // Register dynamic Service Worker Blob
    function initPWA() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'sim-honorer-v1';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration skipped', err));
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-brand-600 text-white',
        warning: 'bg-amber-500 text-white'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        info: 'fa-circle-info',
        warning: 'fa-triangle-exclamation'
      };
      
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 text-sm font-medium ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(title, contentHTML) {
      const overlay = document.getElementById('modalOverlay');
      const box = document.getElementById('modalBox');

          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div>${contentHTML}</div>
      `;
      overlay.classList.remove('hidden');
    }

    window.closeModal = function() {
      document.getElementById('modalOverlay').classList.add('hidden');
    };

    function addAuditLog(aksi, detail) {
      const newLog = {
        id: 'log-' + Date.now(),
        timestamp: new Date().toLocaleString('id-ID'),
        user: currentUser ? (currentUser.role === 'admin' ? 'Admin (' + currentUser.data.email + ')' : currentUser.data.namaSekolah) : 'Anonim',
        role: currentUser ? currentUser.role : 'Guest',
        aksi,
        detail
      };
      state.log_aktivitas.unshift(newLog);
    }

    window.toggleLoginTab = function(type) {

      const schoolDoc = state.sekolah.find(s => s.npsn === npsn && s.password === pass);

          currentUser = {
            role: 'admin',
            data: { email: userCredential.user.email, uid: userCredential.user.uid }
          };
          addAuditLog('Login Admin', `Login Firebase Auth: ${email}`);
          showToast('Login Admin Firebase Berhasil', 'success');
          updateUserUI();
          navigateTo('dashboard');
        } catch (err) {
          showToast('Gagal Login Firebase Auth: ' + err.message, 'error');
        }
      } else {
        showToast('Kredensial Admin tidak valid!', 'error');
      }
    };

    window.handleLogout = function() {
      if (auth && currentUser?.role === 'admin') {
        signOut(auth).catch(() => {});
      }
      addAuditLog('Logout', `User logout: ${currentUser ? (currentUser.data.namaSekolah || currentUser.data.email) : ''}`);
      currentUser = null;
      showToast('Anda telah keluar dari aplikasi', 'info');
      updateUserUI();
      renderLoginView();
    };

    function updateUserUI() {
      const avatar = document.getElementById('userAvatar');
      const nameText = document.getElementById('userNameText');
      const roleBadge = document.getElementById('userRoleBadge');
      const mobileRole = document.getElementById('mobileRoleBadge');

      if (currentUser) {
        if (currentUser.role === 'admin') {
          avatar.innerText = 'A';
          avatar.className = 'w-9 h-9 rounded-full bg-slate-900 text-white font-bold flex items-center justify-center text-xs shrink-0';
          nameText.innerText = currentUser.data.nama || 'Admin Dinas';
          roleBadge.innerText = 'Administrator';
          mobileRole.innerText = 'Admin';
        } else {
          avatar.innerText = 'S';
          avatar.className = 'w-9 h-9 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-xs shrink-0';
          nameText.innerText = currentUser.data.namaSekolah;
          roleBadge.innerText = 'Operator Sekolah';
          mobileRole.innerText = 'Sekolah';

      renderNavigation();

    function renderNavigation() {
      const navContainer = document.getElementById('sidebarNav');
      const bottomNav = document.getElementById('bottomNav');
      
      if (!currentUser) {
        navContainer.innerHTML = '';
        bottomNav.innerHTML = '';

      }

      let menus = [];

      if (currentUser.role === 'admin') {
        menus = [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
          { id: 'sekolah', label: 'Data Sekolah', icon: 'fa-school' },
          { id: 'pegawai', label: 'Data Honorer', icon: 'fa-users' },

          { id: 'rekap', label: 'Rekap & Export', icon: 'fa-print' },
          { id: 'pengguna', label: 'Kelola Pengguna', icon: 'fa-user-gear' },
          { id: 'logs', label: 'Log Aktivitas', icon: 'fa-list-check' },
          { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-sliders' }

          { id: 'status_laporan', label: 'Status & Riwayat', icon: 'fa-clock-rotate-left' }

          <i class="fa-solid ${m.icon} w-5 text-center"></i>
          <span>${m.label}</span>
        </button>

          <span>${m.label}</span>

      if (!currentUser && menuId !== 'login') {
        renderLoginView();
        return;
      }
      activeMenu = menuId;
      renderNavigation();

      const container = document.getElementById('contentView');

      switch (menuId) {
        case 'dashboard': renderDashboardView(container); break;
        case 'sekolah': renderSekolahView(container); break;
        case 'pegawai': renderPegawaiView(container); break;
        case 'periode': renderPeriodeView(container); break;
        case 'penerimaan': renderPenerimaanView(container); break;
        case 'monitoring': renderMonitoringView(container); break;
        case 'rekap': renderRekapView(container); break;
        case 'pengguna': renderPenggunaView(container); break;
        case 'logs': renderLogsView(container); break;
        case 'pengaturan': renderPengaturanView(container); break;

    window.simpanSekolah = function(e) {
      e.preventDefault();
      const npsn = document.getElementById('mNpsn').value.trim();
      const jenjang = document.getElementById('mJenjang').value;
      const namaSekolah = document.getElementById('mNamaSekolah').value.trim();
      const kecamatan = document.getElementById('mKecamatan').value.trim();
      const password = document.getElementById('mPassword').value.trim();

      const newSekolah = {
        id: 'sek-' + Date.now(),
        npsn, jenjang, namaSekolah, kecamatan, password, status: 'Aktif'
      };

      state.sekolah.push(newSekolah);
      addAuditLog('Tambah Sekolah', `Menambahkan sekolah ${namaSekolah} (${npsn})`);
      showToast('Data Sekolah berhasil disimpan', 'success');
      closeModal();
      navigateTo('sekolah');
    };

    window.hapusSekolah = function(id) {
      if (confirm('Yakin ingin menghapus data sekolah ini beserta pegawai honorernya?')) {
        state.sekolah = state.sekolah.filter(s => s.id !== id);
        state.pegawai = state.pegawai.filter(p => p.sekolahId !== id);
        addAuditLog('Hapus Sekolah', `Menghapus sekolah ID ${id}`);
        showToast('Sekolah berhasil dihapus', 'info');
        navigateTo('sekolah');
      }
    };

                        <td class="p-3 border-r border-slate-200">${s.kecamatan}</td>
                        <td class="p-3 border-r border-slate-200 text-center font-bold">${count} Orang</td>
                        <td class="p-3 text-center">Terverifikasi</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>

            <div class="flex justify-between items-center pt-8 text-xs">
              <div></div>
              <div class="text-center space-y-12">
                <p>Mengetahui,<br><strong>Kepala Dinas Pendidikan</strong></p>
                <p class="underline font-bold">__________________________<br>NIP. 19800101 200501 1 001</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // User Management View
    function renderPenggunaView(container) {
      container.innerHTML = `
        <div class="space-y-5">
          <div>
            <h2 class="text-xl font-bold text-slate-800">Manajemen Pengguna & Operator</h2>
            <p class="text-xs text-slate-500">Kelola kredensial akses operator sekolah</p>
          </div>

          <div class="glass-card rounded-2xl overflow-hidden border border-slate-200/80">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-100/70 border-b border-slate-200 text-slate-600 font-semibold">
                  <th class="p-4">Username / NPSN</th>
                  <th class="p-4">Nama Instansi / Sekolah</th>
                  <th class="p-4">Role Hak Akses</th>
                  <th class="p-4">Password</th>
                  <th class="p-4 text-center">Aksi Reset</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <tr class="bg-brand-50/40">
                  <td class="p-4 font-mono font-bold text-brand-900">admin@dinas.go.id</td>
                  <td class="p-4 font-bold text-slate-800">Dinas Pendidikan Utama</td>
                  <td class="p-4"><span class="px-2 py-0.5 rounded bg-slate-900 text-white font-semibold text-[10px]">Super Admin</span></td>
                  <td class="p-4 font-mono">******</td>
                  <td class="p-4 text-center">-</td>
                </tr>
                ${state.sekolah.map(s => `
                  <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 font-mono font-semibold text-brand-700">${s.npsn}</td>
                    <td class="p-4 font-semibold text-slate-800">${s.namaSekolah}</td>
                    <td class="p-4"><span class="px-2 py-0.5 rounded bg-sky-100 text-sky-800 font-semibold text-[10px]">Operator Sekolah</span></td>
                    <td class="p-4 font-mono text-slate-500">${s.password}</td>
                    <td class="p-4 text-center">
                      <button onclick="resetPassSekolah('${s.id}')" class="px-3 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-[10px]">Reset Password</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    window.resetPassSekolah = function(id) {
      const s = state.sekolah.find(sek => sek.id === id);
      if (s) {
        const newP = prompt(`Reset Password untuk ${s.namaSekolah}:`, '123456');
        if (newP) {
          s.password = newP;
          addAuditLog('Reset Password', `Reset password operator ${s.namaSekolah}`);
          showToast('Password operator berhasil dirubah', 'success');
          navigateTo('pengguna');
        }
      }
    };

    function renderLogsView(container) {
      container.innerHTML = `
        <div class="space-y-5">
          <div>
            <h2 class="text-xl font-bold text-slate-800">Log Aktivitas Sistem (Audit Trail)</h2>
            <p class="text-xs text-slate-500">Catatan riwayat aksi pengguna secara rinci</p>
          </div>

          <div class="glass-card rounded-2xl overflow-hidden border border-slate-200/80">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-100/70 border-b border-slate-200 text-slate-600 font-semibold">
                  <th class="p-4">Timestamp</th>
                  <th class="p-4">Pengguna</th>
                  <th class="p-4">Peran</th>
                  <th class="p-4">Aksi</th>
                  <th class="p-4">Detail</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.log_aktivitas.map(l => `
                  <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 text-slate-400 font-mono text-[11px]">${l.timestamp}</td>
                    <td class="p-4 font-semibold text-slate-800">${l.user}</td>
                    <td class="p-4"><span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-medium text-[10px]">${l.role}</span></td>
                    <td class="p-4 font-bold text-brand-700">${l.aksi}</td>
                    <td class="p-4 text-slate-600">${l.detail}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderPengaturanView(container) {
      container.innerHTML = `
        <div class="max-w-xl space-y-6">
          <div>
            <h2 class="text-xl font-bold text-slate-800">Pengaturan Aplikasi</h2>
            <p class="text-xs text-slate-500">Konfigurasi nama instansi dan reset database</p>
          </div>

          <div class="glass-card p-6 rounded-2xl space-y-4 border border-slate-200/80">
            <form onsubmit="simpanPengaturan(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Nama Instansi Dinas</label>
                <input type="text" id="cfgInstansi" value="${state.pengaturan.namaInstansi}" required class="w-full p-2.5 text-xs rounded-xl border border-slate-200">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Kabupaten / Kota</label>
                <input type="text" id="cfgKabKota" value="${state.pengaturan.kabKota}" required class="w-full p-2.5 text-xs rounded-xl border border-slate-200">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Tahun Ajaran Aktif</label>
                <input type="text" id="cfgTahunAjaran" value="${state.pengaturan.tahunAjaran}" required class="w-full p-2.5 text-xs rounded-xl border border-slate-200">
              </div>
              <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl transition">
                Simpan Konfigurasi
              </button>
            </form>
          </div>

          <div class="glass-card p-6 rounded-2xl space-y-3 border border-rose-200 bg-rose-50/20">
            <h3 class="font-bold text-rose-800 text-sm">Reset & Inisialisasi Ulang Data</h3>
            <p class="text-xs text-slate-600">Jalankan ulang autoSetupDatabase() untuk mengembalikan data dummy awal.</p>
            <button onclick="triggerResetDatabase()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-md transition">
              <i class="fa-solid fa-rotate-right"></i> Re-Run Auto Setup Database
            </button>
          </div>
        </div>
      `;
    }

    window.simpanPengaturan = function(e) {
      e.preventDefault();
      state.pengaturan.namaInstansi = document.getElementById('cfgInstansi').value.trim();
      state.pengaturan.kabKota = document.getElementById('cfgKabKota').value.trim();
      state.pengaturan.tahunAjaran = document.getElementById('cfgTahunAjaran').value.trim();

      document.getElementById('sidebarInstansi').innerText = state.pengaturan.namaInstansi;
      addAuditLog('Update Pengaturan', 'Memperbarui nama instansi/tahun ajaran');
      showToast('Pengaturan berhasil disimpan!', 'success');
    };

    window.triggerResetDatabase = async function() {
      if (confirm('Atur ulang seluruh data ke kondisi default sampel?')) {
        await autoSetupDatabase();
        showToast('Database berhasil di-reset ke data sampel!', 'info');
        navigateTo('dashboard');
      }
    };

    window.onload = async function() {
      initPWA();
      await autoSetupDatabase();
      
      // Default initial view is Login screen
      renderLoginView();
    };
  </script>
</body>
</html>
