  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Config & State
    window.IS_PREVIEW = false; // Toggle for Fallback/Preview vs Live Firestore
    
    // Default fallback config
const firebaseConfig = {
  apiKey: "AIzaSyDFc77a44OScUFbMdUaLoY3OtVogfWGLM4",

  messagingSenderId: "289098685441",
  appId: "1:289098685441:web:efad4476cfe4e0fbe03400"
};

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'sim-honorer-default';

    let app, db, auth;
    let currentUser = null; // { role: 'admin'|'sekolah', data: {...} }
    let activeMenu = 'dashboard';

    // In-memory data store for live reactive rendering / preview fallback
    let state = {
      sekolah: [],
      pegawai: [],
      periode: [],
      laporan: [],
      log_aktivitas: [],
      pengaturan: {
        namaInstansi: "Dinas Pendidikan & Kebudayaan",
        kabKota: "Kota Dumai",
        tahunAjaran: "",

        teleponInstansi: "(0765) 33335",
        emailInstansi: "",
        tempatPenandatanganan: "Kota Dumai",
        namaPenandatangan: "MUKHLIS SUZANTRI, S.Hut., T.MT",
        nipPenandatangan: "196905011989092001",
        jabatanPenandatangan: "Kepala Dinas Pendidikan & Kebudayaan"
      }
    };

    // Initialize Firebase
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);
    } catch (err) {
      console.warn("Firebase initialization skipped or preview mode active:", err);
    }

    // Helper Collections Path Generator
    function getPublicCollPath(collName) {
      return collection(db, 'artifacts', appId, 'public', 'data', collName);
    }
    function getPublicDocPath(collName, docId) {
      return doc(db, 'artifacts', appId, 'public', 'data', collName, docId);
    }

    // ---- Firestore CRUD helpers -------------------------------------------------
    // Every write includes an `id` field on the document itself (in addition to
    // the Firestore doc id) because the security rules require
    // request.resource.data.keys().hasAll(['id']) for unauthenticated create/update.
    function generateId(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    const usingFirestore = () => !!db && !window.IS_PREVIEW;

    // Create or fully replace a document. Throws on Firestore failure so callers
    // can show a toast; falls back to the in-memory array only when there is no
    // live Firestore connection at all (preview mode).
    async function fsSave(collName, id, data) {
      const payload = { ...data, id };
      if (usingFirestore()) {
        await setDoc(getPublicDocPath(collName, id), payload);
      } else {
        state[collName].push(payload);
      }
      return payload;
    }

    async function fsUpdate(collName, id, patch) {
      if (usingFirestore()) {
        await updateDoc(getPublicDocPath(collName, id), patch);
      } else {
        const item = state[collName].find(x => x.id === id);
        if (item) Object.assign(item, patch);
      }
    }

    async function fsRemove(collName, id) {
      if (usingFirestore()) {
        await deleteDoc(getPublicDocPath(collName, id));
      } else {
        state[collName] = state[collName].filter(x => x.id !== id);
      }
    }

    // Deletes every document in a collection (used by Reset & Restore).
    async function clearCollection(collName) {
      if (usingFirestore()) {
        const snap = await getDocs(getPublicCollPath(collName));
        await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
      }
      state[collName] = [];
    }

    // Re-render whatever view is currently on screen if it depends on data that
    // just changed underneath it (via a live Firestore listener).
    function rerenderIfActive(menus) {
      if (currentUser && menus.includes(activeMenu)) {
        navigateTo(activeMenu);
      }
    }

    // Keeps `state` live-synced with Firestore after the initial load, so changes
    // made from another tab/device/user show up automatically.
    function attachRealtimeListeners() {
      if (!usingFirestore()) return;

      onSnapshot(getPublicCollPath('sekolah'), (snap) => {
        state.sekolah = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        rerenderIfActive(['dashboard', 'sekolah', 'pegawai', 'pengguna', 'monitoring', 'rekap', 'penerimaan']);
      }, (err) => console.log('Listener sekolah gagal:', err.message));

      onSnapshot(getPublicCollPath('pegawai'), (snap) => {
        state.pegawai = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        rerenderIfActive(['dashboard', 'pegawai', 'submit_laporan']);
      }, (err) => console.log('Listener pegawai gagal:', err.message));

      onSnapshot(getPublicCollPath('periode'), (snap) => {
        state.periode = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        rerenderIfActive(['dashboard', 'periode', 'submit_laporan', 'penerimaan', 'status_laporan']);
      }, (err) => console.log('Listener periode gagal:', err.message));

      onSnapshot(getPublicCollPath('laporan'), (snap) => {
        state.laporan = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        rerenderIfActive(['dashboard', 'penerimaan', 'monitoring', 'rekap', 'submit_laporan', 'status_laporan']);
      }, (err) => console.log('Listener laporan gagal:', err.message));

      onSnapshot(getPublicCollPath('log_aktivitas'), (snap) => {
        state.log_aktivitas = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
        rerenderIfActive(['logs']);
      }, (err) => console.log('Listener log gagal:', err.message));
    }

    async function loadInitialData() {
      if (usingFirestore()) {
        try {
          const settingsDoc = await getDoc(getPublicDocPath('pengaturan', 'config'));
          if (settingsDoc.exists()) {
            state.pengaturan = { ...state.pengaturan, ...settingsDoc.data() };
          }
        } catch (err) {
          console.log('Gagal memuat pengaturan dari Firestore:', err.message);
        }

        try {
          const [sekolahSnap, pegawaiSnap, periodeSnap, laporanSnap, logSnap] = await Promise.all([
            getDocs(getPublicCollPath('sekolah')),
            getDocs(getPublicCollPath('pegawai')),
            getDocs(getPublicCollPath('periode')),
            getDocs(getPublicCollPath('laporan')),
            getDocs(getPublicCollPath('log_aktivitas'))
          ]);
          state.sekolah = sekolahSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          state.pegawai = pegawaiSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          state.periode = periodeSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          state.laporan = laporanSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          state.log_aktivitas = logSnap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
        } catch (err) {
          console.log('Gagal memuat data awal dari Firestore:', err.message);
          showToast('Gagal terhubung ke database Firebase: ' + err.message, 'error');
        }

        // Keep state in sync after the initial load (other tabs/users/devices).
        attachRealtimeListeners();
      }

      try {
        const local = localStorage.getItem('simhonorer_pengaturan');
        if (local) {
          const parsed = JSON.parse(local);
          state.pengaturan = { ...state.pengaturan, ...parsed };
        }
      } catch (err) {
        console.log('Gagal memuat pengaturan dari localStorage:', err.message);
      }

      const instansiEl = document.getElementById('sidebarInstansi');
      if (instansiEl) instansiEl.innerText = state.pengaturan.namaInstansi || 'SIM-HONORER';
    }

    // Register dynamic Service Worker Blob
    function initPWA() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'sim-honorer-v1';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration skipped', err));
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-brand-600 text-white',
        warning: 'bg-amber-500 text-white'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        info: 'fa-circle-info',
        warning: 'fa-triangle-exclamation'
      };
      
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 text-sm font-medium ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(title, contentHTML) {
      const overlay = document.getElementById('modalOverlay');
      const box = document.getElementById('modalBox');
      box.innerHTML = `
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">

          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div>${contentHTML}</div>
      `;
      overlay.classList.remove('hidden');
    }

    window.closeModal = function() {
      document.getElementById('modalOverlay').classList.add('hidden');
    };

    function addAuditLog(aksi, detail) {
      const id = generateId('log');
      const newLog = {
        id,
        timestamp: new Date().toLocaleString('id-ID'),
        createdAtMs: Date.now(),
        user: currentUser ? (currentUser.role === 'admin' ? 'Admin (' + currentUser.data.email + ')' : currentUser.data.namaSekolah) : 'Anonim',
        role: currentUser ? currentUser.role : 'Guest',
        aksi,
        detail
      };
      state.log_aktivitas.unshift(newLog);
      // Fire-and-forget: don't block the calling action on the log write.
      fsSave('log_aktivitas', id, newLog).catch(err => console.log('Gagal menyimpan log aktivitas:', err.message));
    }

    // Show/hide the sidebar, mobile header, and bottom nav depending on login state.
    // These live outside #contentView, so they must be toggled explicitly —
    // clearing #contentView alone (login form) does not hide them.

      const mobileHeader = document.getElementById('mobileHeader');
      const bottomNav = document.getElementById('bottomNav');
      [sidebar, mobileHeader, bottomNav].forEach(el => {
        if (el) el.classList.toggle('force-hidden', !loggedIn);
      });
    }

      const tabSekolah = document.getElementById('tabSekolahBtn');
      const tabAdmin = document.getElementById('tabAdminBtn');
      const formSekolah = document.getElementById('formLoginSekolah');
      const formAdmin = document.getElementById('formLoginAdmin');

      if (type === 'sekolah') {
        tabSekolah.className = 'flex-1 py-2.5 rounded-lg bg-white shadow-sm text-brand-700 transition font-semibold';
        tabAdmin.className = 'flex-1 py-2.5 rounded-lg text-slate-500 transition font-medium';
        formSekolah.classList.remove('hidden');
        formAdmin.classList.add('hidden');
      } else {
        tabAdmin.className = 'flex-1 py-2.5 rounded-lg bg-white shadow-sm text-brand-700 transition font-semibold';
        tabSekolah.className = 'flex-1 py-2.5 rounded-lg text-slate-500 transition font-medium';
        formAdmin.classList.remove('hidden');
        formSekolah.classList.add('hidden');
      }
    };

    window.handleLoginSekolah = function(e) {
      e.preventDefault();
      const npsn = document.getElementById('loginNpsn').value.trim();
      const pass = document.getElementById('loginPassSekolah').value.trim();

      const schoolDoc = state.sekolah.find(s => s.npsn === npsn && s.password === pass);
      if (schoolDoc) {
        currentUser = {
          role: 'sekolah',
          data: schoolDoc
        };
        addAuditLog('Login Operator', `Login berhasil NPSN: ${npsn}`);
        showToast(`Selamat Datang, ${schoolDoc.namaSekolah}`, 'success');
        updateUserUI();
        navigateTo('dashboard');
      } else {
        showToast('NPSN atau Password Sekolah salah!', 'error');
      }
    };

    window.handleLoginAdmin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmailAdmin').value.trim();
      const pass = document.getElementById('loginPassAdmin').value.trim();

      // Fallback demo admin or Firebase Auth
      if (email === 'admin@dinas.go.id' && pass === 'admin123') {
        currentUser = {
          role: 'admin',
          data: { email: 'admin@dinas.go.id', nama: 'Administrator Dinas' }
        };
        addAuditLog('Login Admin', 'Login Admin Dinas berhasil');
        showToast('Login Administrator Berhasil', 'success');
        updateUserUI();
        navigateTo('dashboard');
        return;
      }

      if (auth) {
        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, pass);
          currentUser = {
            role: 'admin',
            data: { email: userCredential.user.email, uid: userCredential.user.uid }
          };
          addAuditLog('Login Admin', `Login Firebase Auth: ${email}`);
          showToast('Login Admin Firebase Berhasil', 'success');
          updateUserUI();
          navigateTo('dashboard');
        } catch (err) {
          showToast('Gagal Login Firebase Auth: ' + err.message, 'error');
        }
      } else {
        showToast('Kredensial Admin tidak valid!', 'error');
      }
    };

    window.handleLogout = function() {
      if (auth && currentUser?.role === 'admin') {
        signOut(auth).catch(() => {});
      }
      addAuditLog('Logout', `User logout: ${currentUser ? (currentUser.data.namaSekolah || currentUser.data.email) : ''}`);
      currentUser = null;
      showToast('Anda telah keluar dari aplikasi', 'info');
      updateUserUI();
      renderLoginView();
    };

      toggleAppChrome(!!currentUser);

      const roleBadge = document.getElementById('userRoleBadge');
      const mobileRole = document.getElementById('mobileRoleBadge');

    window.simpanPeriode = async function(e) {

      const namaPeriode = document.getElementById('prNama').value.trim();
      const bulan = document.getElementById('prBulan').value.trim();
      const tahun = parseInt(document.getElementById('prTahun').value);
      const deadline = document.getElementById('prDeadline').value;

      const id = generateId('per');
      const newPr = { id, namaPeriode, bulan, tahun, deadline, statusAktif: true, createdAt: new Date().toISOString() };

      try {
        // Deactivate any currently-active periode(s) before activating the new one.
        await Promise.all(state.periode.filter(p => p.statusAktif).map(p => fsUpdate('periode', p.id, { statusAktif: false })));
        await fsSave('periode', id, newPr);
        addAuditLog('Tambah Periode', `Membuat periode baru: ${namaPeriode}`);
        showToast('Periode baru diaktifkan!', 'success');
        closeModal();
        navigateTo('periode');

    window.updateOperator = async function(e, id) {
      e.preventDefault();
      const patch = {
        npsn: document.getElementById('oNpsn').value.trim(),
        jenjang: document.getElementById('oJenjang').value,
        namaSekolah: document.getElementById('oNamaSekolah').value.trim(),
        kecamatan: document.getElementById('oKecamatan').value.trim(),
        password: document.getElementById('oPassword').value.trim()
      };
      try {
        await fsUpdate('sekolah', id, patch);
        addAuditLog('Edit Operator', `Memperbarui operator sekolah: ${patch.namaSekolah}`);
        showToast('Data operator berhasil diperbarui', 'success');
        closeModal();
        navigateTo('pengguna');
      } catch (err) {
        showToast('Gagal memperbarui operator: ' + err.message, 'error');
      }
    };

    window.hapusOperator = async function(id) {
      if (!confirm('Yakin ingin menghapus operator sekolah ini beserta seluruh data pegawainya?')) return;
      try {
        const relatedPegawai = state.pegawai.filter(p => p.sekolahId === id);
        await Promise.all(relatedPegawai.map(p => fsRemove('pegawai', p.id)));
        await fsRemove('sekolah', id);
        addAuditLog('Hapus Operator', `Menghapus operator sekolah ID ${id}`);
        showToast('Operator sekolah berhasil dihapus', 'info');
        navigateTo('pengguna');
      } catch (err) {
        showToast('Gagal menghapus operator: ' + err.message, 'error');
      }
    };

    window.resetPassSekolah = async function(id) {
      const s = state.sekolah.find(sek => sek.id === id);
      if (!s) return;
      const newP = prompt(`Reset Password untuk ${s.namaSekolah}:`, '123456');
      if (!newP) return;
      try {
        await fsUpdate('sekolah', id, { password: newP });
        addAuditLog('Reset Password', `Reset password operator ${s.namaSekolah}`);
        showToast('Password operator berhasil dirubah', 'success');
        navigateTo('pengguna');
      } catch (err) {
        showToast('Gagal mereset password: ' + err.message, 'error');
      }
    };

            <p class="text-xs text-slate-500 -mt-3">Cadangkan seluruh data sistem (sekolah, pegawai, periode, laporan, log aktivitas &amp; pengaturan) ke satu file, pulihkan dari file cadangan, atau hapus semua data sekaligus.</p>

            <div class="space-y-3">

              <button type="button" onclick="triggerRestoreFile()" class="w-full py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 border border-slate-200">

    window.simpanPengaturan = async function(e) {
      e.preventDefault();
      state.pengaturan.namaInstansi = document.getElementById('cfgInstansi').value.trim();
      state.pengaturan.kabKota = document.getElementById('cfgKabKota').value.trim();
      state.pengaturan.alamatInstansi = document.getElementById('cfgAlamat').value.trim();
      state.pengaturan.teleponInstansi = document.getElementById('cfgTelepon').value.trim();
      state.pengaturan.emailInstansi = document.getElementById('cfgEmail').value.trim();
      state.pengaturan.tahunAjaran = document.getElementById('cfgTahunAjaran').value.trim();
      state.pengaturan.namaPenandatangan = document.getElementById('cfgNamaTtd').value.trim();
      state.pengaturan.nipPenandatangan = document.getElementById('cfgNipTtd').value.trim();
      state.pengaturan.jabatanPenandatangan = document.getElementById('cfgJabatanTtd').value.trim();
      state.pengaturan.tempatPenandatanganan = document.getElementById('cfgTempatTtd').value.trim();

      document.getElementById('sidebarInstansi').innerText = state.pengaturan.namaInstansi;

      try {
        localStorage.setItem('simhonorer_pengaturan', JSON.stringify(state.pengaturan));
      } catch (_) {}

      if (db && !window.IS_PREVIEW) {
        try {
          await setDoc(getPublicDocPath('pengaturan', 'config'), state.pengaturan);
        } catch (err) {
          console.log('Gagal menyimpan pengaturan ke Firestore:', err.message);
        }
      }

      addAuditLog('Update Pengaturan', 'Memperbarui data instansi & penandatangan laporan');
      showToast('Pengaturan berhasil disimpan!', 'success');
    };

    // ---- Backup / Restore / Reset ----------------------------------------------
    window.backupData = function() {
      const backup = {
        formatVersion: 1,
        appId: appId,
        exportedAt: new Date().toISOString(),
        data: {
          sekolah: state.sekolah,
          pegawai: state.pegawai,
          periode: state.periode,
          laporan: state.laporan,
          log_aktivitas: state.log_aktivitas,
          pengaturan: state.pengaturan
        }
      };

      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup-simhonorer-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      addAuditLog('Backup Data', 'Mengunduh backup seluruh data sistem');
      showToast('Backup data berhasil diunduh', 'success');
    };

    window.triggerRestoreFile = function() {
      document.getElementById('restoreFileInput').click();
    };

    window.handleRestoreFile = async function(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;

      const collections = ['sekolah', 'pegawai', 'periode', 'laporan', 'log_aktivitas'];

      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const backupData = parsed.data || parsed; // toleransi kalau file bukan hasil backupData()

        const hasAnyCollection = collections.some(c => Array.isArray(backupData[c]));
        if (!hasAnyCollection) {
          showToast('File backup tidak valid atau formatnya tidak dikenali', 'error');
          inputEl.value = '';
          return;
        }

        if (!confirm('Restore akan MENGGANTI seluruh data sekolah, pegawai, periode, laporan & log aktivitas saat ini dengan isi file backup ini. Lanjutkan?')) {
          inputEl.value = '';
          return;
        }

        showToast('Memulai proses restore, mohon tunggu...', 'info');

        for (const collName of collections) {
          await clearCollection(collName);
          const items = Array.isArray(backupData[collName]) ? backupData[collName] : [];
          await Promise.all(items.map(item => fsSave(collName, item.id || generateId(collName.slice(0, 3)), item)));
        }

        if (backupData.pengaturan && typeof backupData.pengaturan === 'object') {
          state.pengaturan = { ...state.pengaturan, ...backupData.pengaturan };
          if (usingFirestore()) {
            await setDoc(getPublicDocPath('pengaturan', 'config'), state.pengaturan);
          }
          try {
            localStorage.setItem('simhonorer_pengaturan', JSON.stringify(state.pengaturan));
          } catch (_) {}
          const instansiEl = document.getElementById('sidebarInstansi');
          if (instansiEl) instansiEl.innerText = state.pengaturan.namaInstansi || 'SIM-HONORER';
        }

        addAuditLog('Restore Data', `Memulihkan data dari file backup: ${file.name}`);
        showToast('Restore data berhasil!', 'success');
        inputEl.value = '';
        navigateTo('pengaturan');
      } catch (err) {
        showToast('Gagal memproses file backup: ' + err.message, 'error');
        inputEl.value = '';
      }
    };

    window.resetAllData = async function() {
      const step1 = confirm('PERINGATAN: Ini akan menghapus PERMANEN seluruh data sekolah, pegawai honorer, periode, dan laporan (beserta log aktivitas). Identitas instansi & penandatangan TIDAK akan terhapus. Lanjutkan?');
      if (!step1) return;

      const typed = prompt('Ketik HAPUS (huruf kapital) untuk mengonfirmasi ulang penghapusan seluruh data:');
      if (typed !== 'HAPUS') {
        showToast('Reset data dibatalkan', 'info');
        return;
      }

      try {
        showToast('Menghapus seluruh data, mohon tunggu...', 'info');
        await Promise.all(['sekolah', 'pegawai', 'periode', 'laporan'].map(c => clearCollection(c)));
        await clearCollection('log_aktivitas');
        // Log ini akan menjadi entri pertama pada log aktivitas yang baru.
        addAuditLog('Reset Data', 'Seluruh data sekolah, pegawai, periode, laporan & log aktivitas telah direset');
        showToast('Seluruh data berhasil direset', 'success');
        navigateTo('pengaturan');
      } catch (err) {
        showToast('Gagal mereset data: ' + err.message, 'error');
      }
    };

    window.onload = async function() {
      toggleAppChrome(false);
      initPWA();
      await loadInitialData();
      renderLoginView();
    };
